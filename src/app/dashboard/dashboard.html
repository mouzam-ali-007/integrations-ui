<div class="dashboard-container p-4">


    <div class="controls-row"
        style="display: flex; flex-wrap: wrap; align-items: center; margin-bottom: 2rem; gap: 1.5rem;">
        <!-- Integration Dropdown (only Github for now) -->
        <!-- Spinner -->

        <div>
            <label style="font-weight: 500;">Active Integration:</label>
            <select class="form-control" style="width: 155px; margin-left: 0.5rem;">
                <option selected>Github</option>


            </select>
        </div>
        <!-- Entity (Collection) Dropdown -->
        <div>
            <label style="font-weight: 500;">Entity:</label>


            <select class="form-control" #entitySelect [(ngModel)]="currentEntity"
                (change)="selectEntity(entitySelect.value)">
                <option *ngFor="let entity of collections" [value]="entity.key">
                    {{ entity.display }}
                </option>
            </select>


        </div>
        <div>
            <label style="font-weight: 500;">Processed Entity </label>


            <select class="form-control" style="width: 155px; margin-left: 0.5rem;">
                <option selected>commits</option>
                <option selected>PR</option>


            </select>


        </div>
        <div style="display:flex;">
            <!-- Search -->
            <label style="font-weight: 500;">Search </label>
            <div style="flex:1; max-width:340px;">
                <input type="text" [(ngModel)]="globalSearchText" (input)="onGlobalSearchChange(globalSearchText)"
                    class="form-control w-full p-2 rounded border border-gray-300"
                    placeholder="Search all columns..." />
            </div>
        </div>
        <div *ngIf="isLoading" class="spinner-container">
            <div class="spinner"></div>
        </div>
        <!-- <div class="summary-info" *ngIf="totalRows > 0" style="font-size: 15px; color: #555;margin-left:1em;">
            {{totalRows}} rows
        </div> -->

    </div>
    <!-- <h2 class="text-center mb-3" style="font-size: 1.4em; font-weight: 500;">{{ collections.find(c => c.key===currentEntity)?.display }}</h2> -->
    <!-- ⚙️ AG Grid Table -->
    <ag-grid-angular #agGrid style="width:100%;height:68vh;min-height:300px;" class="ag-theme-alpine"
        [rowData]="rowData" [columnDefs]="columnDefs" [gridOptions]="gridOptions" (gridReady)="onGridReady($event)">
    </ag-grid-angular>

</div>
